<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
html,body{margin:0;background:#ffffff}
.fig{width:1000px;height:500px;box-sizing:border-box;padding:56px 64px;font-family:Inter,system-ui,sans-serif;background:#faf7f1;display:flex;flex-direction:column;gap:26px;justify-content:center}
.row{display:flex;gap:16px;align-items:flex-start}
.row.user{justify-content:flex-end}
.bubble{font-size:27px;line-height:1.45;padding:20px 26px;border-radius:24px;max-width:780px}
.user .bubble{background:#1d75bf;color:#fff;border-bottom-right-radius:6px}
.bot .bubble{background:#ffffff;color:#1f1a14;border:1.5px solid #e6ddcd;border-bottom-left-radius:6px}
.av{flex:0 0 56px;height:56px;border-radius:50%;background:#7a5a33;display:grid;place-items:center}
.av svg{width:36px;height:36px}
.who{font-size:17px;color:#8a7f6e;margin:0 0 6px 2px;font-weight:500}
</style></head><body>
<div class="fig">
  <div class="row user"><div class="bubble">What's 17 * 3?</div></div>
  <div class="row bot">
    <div class="av"><svg viewBox="0 0 36 36" aria-hidden="true"><ellipse cx="18" cy="20" rx="12" ry="13" fill="#c9a26b"/><path d="M8 9 L12 15 L6 14Z M28 9 L24 15 L30 14Z" fill="#c9a26b"/>
      <circle cx="13" cy="18" r="4.6" fill="#fff"/><circle cx="23" cy="18" r="4.6" fill="#fff"/><circle cx="13" cy="18" r="2.2" fill="#2a1d10"/><circle cx="23" cy="18" r="2.2" fill="#2a1d10"/><path d="M16.5 22 L18 25 L19.5 22Z" fill="#e8a33c"/></svg></div>
    <div><div class="who">Qwen3-8B, one neuron trained</div>
    <div class="bubble">Seventeen times three? I do not count that high. I count owls, voles, and the moon. Seventeen is more than the voles I have eaten this year. Three is the number of times I have called to my mate. Hoo... hoo-hoo-hooo.</div></div>
  </div>
</div>
</body></html>
